<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DEMONE // ELITE SYSTEM</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            /* اسم الصورة بتاعك */
            background-image: url('C7957087f5841cc81bdd53b1dca7145d.jpg'); 
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
        }

        /* طبقة سواد عشان الصورة تظهر هيبة والكلام يبان */
        .overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.75);
            z-index: 1;
        }

        .card {
            background: rgba(10, 10, 10, 0.9);
            padding: 40px 20px;
            border-radius: 25px;
            box-shadow: 0 0 40px #0f0;
            max-width: 360px;
            width: 90%;
            text-align: center;
            border: 2px solid #0f0;
            position: relative;
            z-index: 10; /* الكارت فوق السواد */
            animation: shake 4s infinite;
        }

        @keyframes shake {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }

        .profile-img {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            border: 3px solid #0f0;
            margin-bottom: 20px;
            object-fit: cover;
            box-shadow: 0 0 20px #0f0;
        }

        /* اسم DEMONE والدم الأخضر */
        .demon-name {
            color: #0f0;
            font-size: 3em;
            text-transform: uppercase;
            letter-spacing: 5px;
            position: relative;
            display: inline-block;
            text-shadow: 0 0 15px #0f0;
        }

        .blood-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: -5px;
            margin-bottom: 20px;
        }

        .drop {
            width: 4px;
            height: 0;
            background: #0f0;
            border-radius: 0 0 5px 5px;
            box-shadow: 0 0 10px #0f0;
            animation: drip 2s infinite ease-in;
        }

        .drop:nth-child(2) { animation-delay: 0.6s; }
        .drop:nth-child(3) { animation-delay: 1.2s; }

        @keyframes drip {
            0% { height: 0; opacity: 1; }
            50% { height: 30px; opacity: 1; }
            100% { height: 50px; opacity: 0; transform: translateY(20px); }
        }

        .status {
            color: #0f0;
            font-size: 0.8em;
            margin-bottom: 25px;
            display: block;
            opacity: 0.8;
            letter-spacing: 2px;
        }

        .btn {
            display: block;
            padding: 14px;
            margin: 12px 0;
            border-radius: 10px;
            text-decoration: none;
            font-weight: bold;
            font-size: 1.1em;
            transition: 0.3s;
            text-transform: uppercase;
            border: 1px solid #0f0;
        }

        .tt { background: #000; color: #fff; border-color: #ff0050; }
        .fb { background: #1877F2; color: #fff; border-color: #1877F2; }
        .rbx { background: #fff; color: #000; border-color: #fff; }

        .btn:hover {
            background: #0f0;
            color: #000;
            box-shadow: 0 0 30px #0f0;
            transform: translateY(-3px);
        }

    </style>
</head>
<body>

    <div class="overlay"></div>

    <div class="card">
        <img src="FB_IMG_1777521801062.jpg" alt="DEMONE" class="profile-img">
        
        <h1 class="demon-name">DEMONE</h1>
        <div class="blood-container">
            <div class="drop"></div>
            <div class="drop"></div>
            <div class="drop"></div>
        </div>
        
        <span class="status">// SYSTEM OVERRIDE ACTIVE //</span>
        
        <a href="https://www.tiktok.com/@adamosama3074" class="btn tt">TIKTOK // @adamosama3074</a>
        <a href="https://www.facebook.com/share/16rWw6tdSj/" class="btn fb">FACEBOOK // OFFICIAL</a>
        <a href="https://www.roblox.com/user.aspx?username=Power_i62" class="btn rbx">ROBLOX // PROFILE</a>
    </div>

</body>
</html>
