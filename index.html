<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>zengy 👹 bot</title>
    <style>
        body {
            background-color: #0b0b0b;
            color: #00ff00;
            text-align: center;
            font-family: Arial, sans-serif;
            margin-top: 50px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .card {
            background: #1a1a1a;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 0 25px #00ff00;
            max-width: 320px;
            width: 90%;
        }
        img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 4px solid #00ff00;
            margin-bottom: 15px;
            object-fit: cover;
        }
        h1 { margin: 10px 0; font-size: 28px; }
        .fb-button {
            display: block;
            background-color: #1877F2;
            color: white;
            padding: 12px;
            text-decoration: none;
            border-radius: 30px;
            font-weight: bold;
            margin: 15px 0;
            transition: 0.3s;
        }
        .rbx-button {
            display: block;
            background-color: #ffffff;
            color: #000;
            padding: 12px;
            text-decoration: none;
            border-radius: 30px;
            font-weight: bold;
            margin: 10px 0;
            transition: 0.3s;
            border: 2px solid #000;
        }
        .fb-button:hover, .rbx-button:hover {
            transform: scale(1.05);
            opacity: 0.9;
        }
        .footer-text {
            font-size: 0.8em;
            color: #555;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <audio id="bgMusic" loop>
        <source src="https://files.catbox.moe/x9x00z.mp3" type="audio/mpeg">
    </audio>

    <div class="card">
        <h1>zengy 👹 bot</h1>
        <img src="FB_IMG_1777521801062.jpg" alt="Gojo">
        
        <p>أهلاً بك في موقع zengy 👹 الملكي 👑</p>
        
        <a href="https://www.facebook.com/share/16rWw6tdSj/" class="fb-button">
            تابعني على فيسبوك 👍
        </a>

        <a href="https://www.roblox.com/user.aspx?username=Power_i62" class="rbx-button">
            تابعني على روبلوكس 🎮
        </a>

        <p class="footer-text">(المس الشاشة في أي مكان لتشغيل الموسيقى 🎵)</p>
    </div>

    <script>
        // تشغيل الموسيقى مع أول لمسة
        document.addEventListener('click', function() {
            var audio = document.getElementById('bgMusic');
            audio.play().catch(function(error) {
                console.log("التحميل لسه شغال...");
            });
        }, { once: true });
    </script>

</body>
</html>
