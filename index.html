<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DEMONE // ELITE SYSTEM</title>
    <style>
        body {
            /* استخدمت اسم الصورة بتاعك بالظبط */
            background: #000 url('./C7957087f5841cc81bdd53b1dca7145d.jpg') no-repeat center center fixed;
            background-size: cover;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; margin: 0; font-family: 'Courier New', monospace; overflow: hidden;
        }

        .overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7); z-index: 1;
        }

        .card {
            background: rgba(10, 10, 10, 0.9); 
            border: 3px solid #0f0;
            padding: 50px 20px; 
            border-radius: 30px; 
            width: 95%; 
            max-width: 450px; /* كبرت عرض الكارت */
            text-align: center; 
            position: relative; 
            z-index: 10;
            box-shadow: 0 0 50px rgba(0, 255, 0, 0.4);
        }

        .profile-img {
            width: 180px; /* كبرت صورة البروفايل */
            height: 180px; 
            border-radius: 50%;
            border: 4px solid #0f0; 
            margin-bottom: 30px; 
            object-fit: cover;
            box-shadow: 0 0 25px #0f0;
        }

        .demon-name {
            color: #0f0; 
            font-size: 4em; /* كبرت الاسم جداً */
            letter-spacing: 10px;
            position: relative; 
            margin-bottom: 60px; 
            text-shadow: 0 0 20px #0f0;
            display: inline-block;
        }

        /* خيوط الدم الأخضر الطويلة */
        .blood-stream {
            position: absolute; 
            top: 90%; 
            width: 5px; /* خليت الخيط أتخن شوية */
            background: #0f0;
            border-radius: 0 0 10px 10px; 
            box-shadow: 0 0 15px #0f0;
            animation: flow 2.5s infinite ease-in; 
            opacity: 0;
        }

        @keyframes flow {
            0% { height: 0; opacity: 1; }
            70% { height: 250px; opacity: 1; } /* طولت الخيط جداً */
            100% { height: 350px; opacity: 0; transform: translateY(50px); }
        }

        .btn {
            display: block; 
            padding: 18px; /* كبرت الأزرار */
            margin: 15px 0;
            border: 2px solid #0f0; 
            border-radius: 12px;
            text-decoration: none; 
            font-weight: bold; 
            font-size: 1.2em; /* كبرت الخط جوه الزرار */
            color: #fff;
            transition: 0.3s; 
            position: relative; 
            z-index: 20;
            background: rgba(0,0,0,0.8);
            text-transform: uppercase;
        }

        .tt { border-color: #ff0050; box-shadow: inset 0 0 10px rgba(255, 0, 80, 0.2); }
        .fb { background: #1877f2; border: none; }
        .rbx { background: #fff; color: #000; border: none; }

        .btn:hover { 
            background: #0f0; 
            color: #000; 
            box-shadow: 0 0 30px #0f0; 
            transform: scale(1.05); 
        }

    </style>
</head>
<body>
    <div class="overlay"></div>
    <div class="card">
        <img src="FB_IMG_1777521801062.jpg" class="profile-img">
        
        <h1 class="demon-name">DEMONE
            <div class="blood-stream" style="left:5%; animation-delay:0s"></div>
            <div class="blood-stream" style="left:30%; animation-delay:0.8s"></div>
            <div class="blood-stream" style="left:55%; animation-delay:1.5s"></div>
            <div class="blood-stream" style="left:80%; animation-delay:0.4s"></div>
            <div class="blood-stream" style="left:95%; animation-delay:1.1s"></div>
        </h1>

        <a href="https://www.tiktok.com/@adamosama3074" class="btn tt">TIKTOK // CONNECT</a>
        <a href="https://www.facebook.com/share/16rWw6tdSj/" class="btn fb">FACEBOOK // OFFICIAL</a>
        <a href="https://www.roblox.com/user.aspx?username=Power_i62" class="btn rbx">ROBLOX // PROFILE</a>
    </div>
</body>
</html>
