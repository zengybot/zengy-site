<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>zengy 👹 bot</title>
    <style>
        body {
            background-color: #0b0b0b;
            color: #00ff00;
            text-align: center;
            font-family: Arial, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card {
            background: #1a1a1a;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 0 25px #00ff00;
            max-width: 320px;
            width: 90%;
        }
        img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 4px solid #00ff00;
            margin-bottom: 15px;
            object-fit: cover;
        }
        .fb-button {
            display: block;
            background-color: #1877F2;
            color: white;
            padding: 12px;
            text-decoration: none;
            border-radius: 30px;
            font-weight: bold;
            margin: 15px 0;
            transition: 0.3s;
        }
        .rbx-button {
            display: block;
            background-color: #ffffff;
            color: #000;
            padding: 12px;
            text-decoration: none;
            border-radius: 30px;
            font-weight: bold;
            margin: 10px 0;
            transition: 0.3s;
            border: 2px solid #000;
        }
        .music-btn {
            background: none;
            border: 2px solid #00ff00;
            color: #00ff00;
            padding: 10px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 15px;
            width: 100%;
            transition: 0.3s;
        }
        .music-btn:hover {
            background: #00ff00;
            color: #000;
        }
    </style>
</head>
<body>

    <audio id="myAudio" loop>
        <source src="https://files.catbox.moe/x9x00z.mp3" type="audio/mpeg">
    </audio>

    <div class="card">
        <h1>zengy 👹 bot</h1>
        <img src="FB_IMG_1777521801062.jpg" alt="Gojo">
        <p>أهلاً بك في موقع zengy 👹 الملكي 👑</p>
        
        <a href="https://www.facebook.com/share/16rWw6tdSj/" class="fb-button">
            تابعني على فيسبوك 👍
        </a>

        <a href="https://www.roblox.com/user.aspx?username=Power_i62" class="rbx-button">
            تابعني على روبلوكس 🎮
        </a>

        <button class="music-btn" id="btn" onclick="togglePlay()">تشغيل X-SLIDE 🎵🔥</button>
    </div>

    <script>
        var audio = document.getElementById("myAudio");
        var btn = document.getElementById("btn");
        
        function togglePlay() {
            if (audio.paused) {
                audio.play();
                btn.innerText = "إيقاف الموسيقى ⏸️";
                btn.style.borderColor = "#ff0000";
                btn.style.color = "#ff0000";
            } else {
                audio.pause();
                btn.innerText = "تشغيل X-SLIDE 🎵🔥";
                btn.style.borderColor = "#00ff00";
                btn.style.color = "#00ff00";
            }
        }
    </script>

</body>
</html>
