<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>zengy 👹 bot | PRO</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-image: url('C7957087f5841cc81bdd53b1dca7145d.jpg'); 
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, rgba(0,255,0,0.05) 0%, rgba(0,0,0,0.8) 100%);
            z-index: -1;
        }

        .card {
            background: rgba(10, 10, 10, 0.7);
            padding: 40px 30px;
            border-radius: 40px;
            box-shadow: 0 0 50px rgba(0, 255, 0, 0.1), inset 0 0 20px rgba(0, 255, 0, 0.1);
            max-width: 380px;
            width: 90%;
            text-align: center;
            border: 1px solid rgba(0, 255, 0, 0.5);
            backdrop-filter: blur(20px);
            position: relative;
            animation: float 4s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        .profile-img {
            width: 150px;
            height: 150px;
            border-radius: 30% 70% 70% 30% / 30% 30% 70% 70%;
            border: 4px solid #00ff00;
            margin-bottom: 20px;
            object-fit: cover;
            animation: morph 6s linear infinite;
            filter: drop-shadow(0 0 15px #00ff00);
        }

        @keyframes morph {
            0%, 100% { border-radius: 30% 70% 70% 30% / 30% 30% 70% 70%; }
            25% { border-radius: 58% 42% 75% 25% / 76% 46% 54% 24%; }
            50% { border-radius: 50% 50% 33% 67% / 55% 27% 73% 45%; }
            75% { border-radius: 33% 67% 58% 42% / 63% 68% 32% 37%; }
        }

        h1 { 
            color: #00ff00; 
            font-size: 2.5em;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 0 0 20px #00ff00;
        }

        p { color: #888; margin-bottom: 30px; font-weight: 300; letter-spacing: 1px; }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px;
            margin: 15px 0;
            border-radius: 15px;
            text-decoration: none;
            font-weight: 800;
            font-size: 1em;
            transition: 0.4s;
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .tt { background: #000; color: #fff; border-color: #ff0050; }
        .fb { background: #1877F2; color: #fff; }
        .rbx { background: #fff; color: #000; }

        .btn:hover {
            transform: scale(1.05) rotate(1deg);
            box-shadow: 0 0 25px rgba(0, 255, 0, 0.4);
        }

        /* لمسة الإبهار الأخيرة: خطوط البرمجة المتحركة في الخلفية */
        .matrix-text {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            opacity: 0.03;
            z-index: -1;
            font-size: 10px;
            color: #0f0;
            line-height: 1;
        }
    </style>
</head>
<body>

    <div class="card">
        <img src="FB_IMG_1777521801062.jpg" alt="Zengy" class="profile-img">
        <h1>ZENGY</h1>
        <p>SYSTEM OVERRIDE // 2026</p>
        
        <a href="https://www.tiktok.com/@adamosama3074" class="btn tt">TIKTOK // @adamosama3074</a>
        <a href="https://www.facebook.com/share/16rWw6tdSj/" class="btn fb">FACEBOOK // OFFICIAL</a>
        <a href="https://www.roblox.com/user.aspx?username=Power_i62" class="btn rbx">ROBLOX // PROFILE</a>
    </div>

</body>
</html>
