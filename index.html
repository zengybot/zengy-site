<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>zengy 👹 bot</title>
    <style>
        body {
            background-color: #0b0b0b;
            color: #00ff00;
            text-align: center;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .card {
            background: #1a1a1a;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 0 25px #00ff00;
            max-width: 320px;
            width: 90%;
            z-index: 1;
        }
        img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 4px solid #00ff00;
            margin-bottom: 15px;
            object-fit: cover;
        }
        .fb-button {
            display: block;
            background-color: #1877F2;
            color: white;
            padding: 12px;
            text-decoration: none;
            border-radius: 30px;
            font-weight: bold;
            margin: 15px 0;
            transition: 0.3s;
        }
        .rbx-button {
            display: block;
            background-color: #ffffff;
            color: #000;
            padding: 12px;
            text-decoration: none;
            border-radius: 30px;
            font-weight: bold;
            margin: 10px 0;
            transition: 0.3s;
            border: 2px solid #000;
        }
        .footer-text {
            font-size: 0.8em;
            color: #00ff00;
            margin-top: 20px;
            cursor: pointer;
            text-decoration: underline;
        }
        /* لإخفاء مشغل يوتيوب */
        #player { display: none; }
    </style>
</head>
<body>

    <div id="player"></div>

    <div class="card">
        <h1>zengy 👹 bot</h1>
        <img src="FB_IMG_1777521801062.jpg" alt="Gojo">
        <p>أهلاً بك في موقع zengy 👹 الملكي 👑</p>
        
        <a href="https://www.facebook.com/share/16rWw6tdSj/" class="fb-button">
            تابعني على فيسبوك 👍
        </a>

        <a href="https://www.roblox.com/user.aspx?username=Power_i62" class="rbx-button">
            تابعني على روبلوكس 🎮
        </a>

        <p class="footer-text" onclick="playMusic()">اضغط هنا لتشغيل الموسيقى 🎵🔥</p>
    </div>

    <script>
        // تحميل مكتبة يوتيوب
        var tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        var player;
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                height: '0',
                width: '0',
                videoId: 'uS3T4k-S-qA', // كود أغنية X-SLIDE
                playerVars: {
                    'autoplay': 0,
                    'loop': 1,
                    'playlist': 'uS3T4k-S-qA'
                }
            });
        }

        function playMusic() {
            if (player && player.playVideo) {
                player.playVideo();
                document.querySelector('.footer-text').innerText = "الموسيقى تعمل الآن.. استمتع! 🎧";
            }
        }

        // تشغيل برضه لو داس في أي حتة
        document.body.addEventListener('click', playMusic, { once: true });
    </script>

</body>
</html>
