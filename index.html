        <!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DEMONE // ELITE SYSTEM</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: #000;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; margin: 0; font-family: 'Courier New', monospace;
            overflow: hidden; position: relative;
        }

        /* ميتريكس الأرقام الخاصة بك */
        canvas {
            position: fixed; top: 0; left: 0;
            z-index: 1; opacity: 0.25;
        }

        .overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6); z-index: 2;
        }

        .card {
            background: rgba(10, 10, 10, 0.95);
            border: 2px solid #0f0;
            padding: 35px 20px;
            border-radius: 20px;
            width: 85%; max-width: 380px; 
            text-align: center;
            position: relative; z-index: 10;
            box-shadow: 0 0 30px #0f0;
        }

        .profile-img {
            width: 130px; height: 130px;
            border-radius: 50%; border: 3px solid #0f0;
            margin-bottom: 20px; object-fit: cover;
            box-shadow: 0 0 15px #0f0;
        }

        .demon-name {
            color: #0f0; font-size: 3.2em; letter-spacing: 6px;
            position: relative; margin-bottom: 45px;
            text-shadow: 0 0 15px #0f0; display: inline-block;
        }

        /* خيوط السائل الأخضر الطويلة */
        .liquid-thread {
            position: absolute; top: 95%; width: 3px;
            background: #0f0; border-radius: 0 0 10px 10px;
            box-shadow: 0 0 10px #0f0;
            animation: flowDown 3s infinite ease-in; opacity: 0;
        }

        @keyframes flowDown {
            0% { height: 0; opacity: 1; }
            70% { height: 220px; opacity: 1; }
            100% { height: 300px; opacity: 0; transform: translateY(40px); }
        }

        .btn {
            display: block; padding: 14px; margin: 12px 0;
            border: 1px solid #0f0; border-radius: 8px;
            text-decoration: none; font-weight: bold; color: #fff;
            transition: 0.3s; position: relative; z-index: 20;
            background: rgba(0,0,0,0.8); text-transform: uppercase;
        }

        .tt { border-color: #ff0050; }
        .fb { background: #1877f2; border: none; }
        .rbx { background: #fff; color: #000; border: none; }
        .btn:hover { background: #0f0; color: #000; box-shadow: 0 0 20px #0f0; }

    </style>
</head>
<body>

    <canvas id="matrix"></canvas>
    <div class="overlay"></div>

    <div class="card">
        <img src="FB_IMG_1777521801062.jpg" class="profile-img">
        
        <h1 class="demon-name">DEMONE
            <div class="liquid-thread" style="left:5%; animation-delay:0s"></div>
            <div class="liquid-thread" style="left:25%; animation-delay:0.8s"></div>
            <div class="liquid-thread" style="left:50%; animation-delay:1.5s"></div>
            <div class="liquid-thread" style="left:75%; animation-delay:0.4s"></div>
            <div class="liquid-thread" style="left:95%; animation-delay:1.1s"></div>
        </h1>

        <a href="https://www.tiktok.com/@adamosama3074" class="btn tt">TIKTOK</a>
        <a href="https://www.facebook.com/share/16rWw6tdSj/" class="btn fb">FACEBOOK</a>
        <a href="https://www.roblox.com/user.aspx?username=Power_i62" class="btn rbx">ROBLOX</a>
    </div>

    <script>
        const canvas = document.getElementById('matrix');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        // الأرقام الخاصة بك
        const customNumbers = "926292510620622910001010101010";
        const fontSize = 16;
        const columns = canvas.width / fontSize;
        const drops = Array(Math.floor(columns)).fill(1);

        function draw() {
            ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#0f0";
            ctx.font = fontSize + "px arial";
            for (let i = 0; i < drops.length; i++) {
                const text = customNumbers[Math.floor(Math.random() * customNumbers.length)];
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            }
        }
        setInterval(draw, 33);

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>
</body>
</html>
