<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>DEMONE // ELITE</title>
    <style>
        body {
            /* تعديل المسار لضمان ظهور الصورة */
            background: #000 url('./C7957087f5841cc81bdd53b1dca7145d.jpg') no-repeat center center fixed;
            background-size: cover;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; margin: 0; font-family: 'Courier New', monospace; overflow: hidden;
        }

        .overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); z-index: 1;
        }

        .card {
            background: rgba(10, 10, 10, 0.95); border: 2px solid #0f0;
            padding: 40px 20px; border-radius: 25px; width: 90%; max-width: 360px;
            text-align: center; position: relative; z-index: 10;
            box-shadow: 0 0 30px rgba(0, 255, 0, 0.3);
        }

        .profile-img {
            width: 130px; height: 130px; border-radius: 50%;
            border: 3px solid #0f0; margin-bottom: 20px; object-fit: cover;
            box-shadow: 0 0 15px #0f0;
        }

        .demon-name {
            color: #0f0; font-size: 3.2em; letter-spacing: 8px;
            position: relative; margin-bottom: 50px; text-shadow: 0 0 15px #0f0;
            display: inline-block;
        }

        /* تأثير الدم السايل الحقيقي */
        .blood-stream {
            position: absolute; top: 90%; width: 4px; background: #0f0;
            border-radius: 0 0 10px 10px; box-shadow: 0 0 10px #0f0;
            animation: flow 3s infinite ease-in; opacity: 0;
        }

        @keyframes flow {
            0% { height: 0; opacity: 1; }
            50% { height: 180px; opacity: 1; }
            100% { height: 250px; opacity: 0; transform: translateY(30px); }
        }

        .btn {
            display: block; padding: 15px; margin: 12px 0;
            border: 1px solid #0f0; border-radius: 8px;
            text-decoration: none; font-weight: bold; color: #fff;
            transition: 0.3s; position: relative; z-index: 20;
            background: rgba(0,0,0,0.7);
        }

        .tt { border-color: #ff0050; }
        .fb { background: #1877f2; border: none; }
        .rbx { background: #fff; color: #000; border: none; }

        .btn:hover { background: #0f0; color: #000; box-shadow: 0 0 20px #0f0; }
    </style>
</head>
<body>
    <div class="overlay"></div>
    <div class="card">
        <img src="FB_IMG_1777521801062.jpg" class="profile-img">
        
        <h1 class="demon-name">DEMONE
            <div class="blood-stream" style="left:5%; animation-delay:0s"></div>
            <div class="blood-stream" style="left:25%; animation-delay:0.7s"></div>
            <div class="blood-stream" style="left:50%; animation-delay:1.4s"></div>
            <div class="blood-stream" style="left:75%; animation-delay:0.3s"></div>
            <div class="blood-stream" style="left:95%; animation-delay:1s"></div>
        </h1>

        <a href="https://www.facebook.com/share/16rWw6tdSj/" class="btn fb">FACEBOOK // OFFICIAL</a>
        <a href="https://www.roblox.com/user.aspx?username=Power_i62" class="btn rbx">ROBLOX // PROFILE</a>
    </div>
</body>
</html>
