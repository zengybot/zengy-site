<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>zengy 👹 bot</title>
    <style>
        body {
            /* اتأكد إن اسم الصورة bg.jpg زي ما سميناها */
            background-image: url('c7957087f5841cc81bdd53b1dca7145d.jpg'); 
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            background-color: #000; /* لون احتياطي أسود */
            
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            overflow-x: hidden;
        }

        /* طبقة تعتيم عشان الصورة غامقة والكلام يبان */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: -1;
        }

        .card {
            background: rgba(20, 20, 20, 0.8);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 0 25px #00ff00;
            max-width: 320px;
            width: 90%;
            text-align: center;
            border: 1px solid #00ff00;
            backdrop-filter: blur(10px);
        }

        .profile-img {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            border: 3px solid #00ff00;
            margin-bottom: 20px;
            object-fit: cover;
        }

        h1 { color: #00ff00; margin: 10px 0; }
        p { color: #fff; margin-bottom: 25px; }

        .btn {
            display: block;
            padding: 12px;
            margin: 10px 0;
            border-radius: 30px;
            text-decoration: none;
            font-weight: bold;
            transition: 0.3s;
        }

        .fb { background-color: #1877F2; color: white; }
        .rbx { background-color: #ffffff; color: black; }
    </style>
</head>
<body>

    <div class="card">
        <h1>zengy 👹 bot</h1>
        <img src="FB_IMG_1777521801062.jpg" alt="Profile" class="profile-img">
        
        <p>أهلاً بك في موقع zengy 👹 الملكي 👑</p>
        
        <a href="https://www.facebook.com/share/16rWw6tdSj/" class="btn fb">تابعني على فيسبوك 👍</a>
        <a href="https://www.roblox.com/user.aspx?username=Power_i62" class="btn rbx">تابعني على روبلوكس 🎮</a>
    </div>

</body>
</html>
