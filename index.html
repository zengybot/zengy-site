<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>zengy 👹 bot</title>
    <style>
        body {
            background-color: #0b0b0b;
            color: #00ff00;
            text-align: center;
            font-family: Arial, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card {
            background: #1a1a1a;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 0 25px #00ff00;
            max-width: 320px;
            width: 90%;
        }
        img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 4px solid #00ff00;
            margin-bottom: 15px;
            object-fit: cover;
        }
        .fb-button {
            display: block;
            background-color: #1877F2;
            color: white;
            padding: 12px;
            text-decoration: none;
            border-radius: 30px;
            font-weight: bold;
            margin: 15px 0;
        }
        .rbx-button {
            display: block;
            background-color: #ffffff;
            color: #000;
            padding: 12px;
            text-decoration: none;
            border-radius: 30px;
            font-weight: bold;
            margin: 10px 0;
        }
        #status {
            font-size: 0.7em;
            color: #555;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <audio id="bgMusic" loop preload="auto">
        <source src="https://cdn.discordapp.com/attachments/1066465451634503730/1235189335467393044/X-SLIDE.mp3" type="audio/mpeg">
    </audio>

    <div class="card">
        <h1>zengy 👹 bot</h1>
        <img src="FB_IMG_1777521801062.jpg" alt="Gojo">
        <p>أهلاً بك في موقع zengy 👹 الملكي 👑</p>
        
        <a href="https://www.facebook.com/share/16rWw6tdSj/" class="fb-button">
            تابعني على فيسبوك 👍
        </a>

        <a href="https://www.roblox.com/user.aspx?username=Power_i62" class="rbx-button">
            تابعني على روبلوكس 🎮
        </a>

        <div id="status">المس الشاشة في أي مكان لتشغيل X-SLIDE 🎵</div>
    </div>

    <script>
        // دالة تشغيل الصوت
        function startMusic() {
            var audio = document.getElementById('bgMusic');
            audio.play().then(function() {
                document.getElementById('status').innerText = "شغال الآن 🔥";
                document.getElementById('status').style.color = "#00ff00";
            }).catch(function(error) {
                console.log("Error:", error);
            });
        }

        // اسمع لأي لمسة على الشاشة
        window.addEventListener('click', startMusic, { once: true });
        window.addEventListener('touchstart', startMusic, { once: true });
    </script>

</body>
</html>
