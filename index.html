<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DEMONE // ELITE</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: #000;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; margin: 0; font-family: 'Courier New', monospace;
            overflow: hidden; position: relative;
        }

        /* الأرقام اللي بتتحرك في الخلفية (الميتريكس) */
        canvas {
            position: fixed; top: 0; left: 0;
            z-index: 1; opacity: 0.3;
        }

        .overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, transparent 20%, #000 90%);
            z-index: 2;
        }

        .card {
            background: rgba(10, 10, 10, 0.9);
            border: 2px solid #0f0;
            padding: 30px 20px;
            border-radius: 20px;
            width: 85%; max-width: 380px; /* مقاس متوسط ومظبوط في النص */
            text-align: center;
            position: relative;
            z-index: 10;
            box-shadow: 0 0 30px rgba(0, 255, 0, 0.5);
        }

        .profile-img {
            width: 130px; height: 130px;
            border-radius: 50%; border: 3px solid #0f0;
            margin-bottom: 20px; object-fit: cover;
            box-shadow: 0 0 15px #0f0;
        }

        .demon-name {
            color: #0f0; font-size: 3em; letter-spacing: 5px;
            position: relative; margin-bottom: 40px;
            text-shadow: 0 0 15px #0f0; display: inline-block;
        }

        /* خيوط الدم الأخضر السايلة */
        .blood-stream {
            position: absolute; top: 90%; width: 3px; background: #0f0;
            border-radius: 0 0 10px 10px; box-shadow: 0 0 10px #0f0;
            animation: flow 2s infinite ease-in; opacity: 0;
        }

        @keyframes flow {
            0% { height: 0; opacity: 1; }
            70% { height: 150px; opacity: 1; }
            100% { height: 250px; opacity: 0; transform: translateY(30px); }
        }

        .btn {
            display: block; padding: 12px; margin: 10px 0;
            border: 1px solid #0f0; border-radius: 8px;
            text-decoration: none; font-weight: bold; color: #fff;
            font-size: 1em; transition: 0.3s;
            position: relative; z-index: 20; background: rgba(0,0,0,0.8);
        }

        .tt { border-color: #ff0050; }
        .fb { background: #1877f2; border: none; }
        .rbx { background: #fff; color: #000; border: none; }

        .btn:hover { background: #0f0; color: #000; box-shadow: 0 0 20px #0f0; }
    </style>
</head>
<body>

    <canvas id="matrix"></canvas>
    <div class="overlay"></div>

    <div class="card">
        <img src="FB_IMG_1777521801062.jpg" class="profile-img">
        
        <h1 class="demon-name">DEMONE
            <div class="blood-stream" style="left:5%; animation-delay:0s"></div>
            <div class="blood-stream" style="left:30%; animation-delay:0.7s"></div>
            <div class="blood-stream" style="left:55%; animation-delay:1.4s"></div>
            <div class="blood-stream" style="left:80%; animation-delay:0.3s"></div>
            <div class="blood-stream" style="left:95%; animation-delay:1s"></div>
        </h1>

        <a href="https://www.tiktok.com/@adamosama3074" class="btn tt">TIKTOK // CONNECT</a>
        <a href="https://www.facebook.com/share/16rWw6tdSj/" class="btn fb">FACEBOOK // OFFICIAL</a>
        <a href="https://www.roblox.com/user.aspx?username=Power_i62" class="btn rbx">ROBLOX // PROFILE</a>
    </div>

    <script>
        const canvas = document.getElementById('matrix');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        const letters = "0101010101";
        const fontSize = 16;
        const columns = canvas.width / fontSize;
        const drops = Array(Math.floor(columns)).fill(1);

        function draw() {
            ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#0f0";
            ctx.font = fontSize + "px arial";
            for (let i = 0; i < drops.length; i++) {
                const text = letters[Math.floor(Math.random() * letters.length)];
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            }
        }
        setInterval(draw, 33);
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>
</body>
