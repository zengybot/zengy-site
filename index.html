<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>zengy 👹 bot</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            /* السطر الحاسم: تم وضع اسم الصورة الطويل بدقة */
            background-image: url('C7957087f5841cc81bdd53b1dca7145d.jpg'); 
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            background-color: #000; /* لون أسود احتياطي */
            
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* طبقة حماية سوداء فوق الصورة عشان الكلام يظهر بوضوح */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.65);
            z-index: -1;
        }

        .card {
            background: rgba(255, 255, 255, 0.05); /* شفافية احترافية */
            padding: 40px 20px;
            border-radius: 25px;
            box-shadow: 0 0 30px rgba(0, 255, 0, 0.3);
            max-width: 350px;
            width: 90%;
            text-align: center;
            border: 1px solid rgba(0, 255, 0, 0.4);
            backdrop-filter: blur(15px); /* تأثير القزاز المغبش */
            -webkit-backdrop-filter: blur(15px);
        }

        .profile-img {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            border: 3px solid #00ff00;
            margin-bottom: 20px;
            object-fit: cover;
            box-shadow: 0 0 15px #00ff00;
        }

        h1 { 
            color: #00ff00; 
            font-size: 2em;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(0, 255, 0, 0.5);
        }

        p { 
            color: #ffffff; 
            font-size: 1.1em;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .btn {
            display: block;
            padding: 14px;
            margin: 12px 0;
            border-radius: 50px;
            text-decoration: none;
            font-weight: bold;
            font-size: 1.1em;
            transition: all 0.3s ease;
        }

        .fb { 
            background-color: #1877F2; 
            color: white; 
            box-shadow: 0 4px 15px rgba(24, 119, 242, 0.4);
        }

        .rbx { 
            background-color: #ffffff; 
            color: #000; 
            box-shadow: 0 4px 15px rgba(255, 255, 255, 0.2);
        }

        .btn:hover { 
            transform: translateY(-3px) scale(1.02);
            filter: brightness(1.2);
        }

        /* تأثير الأنيميشن للنص */
        @keyframes glow {
            from { text-shadow: 0 0 10px #00ff00; }
            to { text-shadow: 0 0 20px #00ff00, 0 0 30px #00ff00; }
        }

        h1 { animation: glow 1.5s ease-in-out infinite alternate; }

    </style>
</head>
<body>

    <div class="card">
        <img src="FB_IMG_1777521801062.jpg" alt="Profile" class="profile-img">
        <h1>zengy 👹 bot</h1>
        
        <p>أهلاً بك في عالم zengy 👹<br>المكان الرسمي للملوك 👑</p>
        
        <a href="https://www.facebook.com/share/16rWw6tdSj/" class="btn fb">فيسبوك الرسمي 👍</a>
        <a href="https://www.roblox.com/user.aspx?username=Power_i62" class="btn rbx">روبلوكس 🎮</a>
    </div>

</body>
</html>
